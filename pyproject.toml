[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bookassembler"
version = "0.1.0"
description = "Automated technical book translation pipeline"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyjobkit[sqlite]>=1.0",
]

[project.optional-dependencies]
api = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]
