services:
  kae:
    build:
      context: .
    container_name: kae-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - /data/kae:/data/ssd
      - kae-db:/app/data
    # Settings from .env (see .env.example), when there is one.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - KAE_SSD_PATH=/data/ssd
      - KAE_DATA_DIR=/data/ssd/.kae
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  kae-db:
