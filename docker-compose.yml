services:
  kae:
    build:
      context: .
    container_name: kae-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
      # The API without the gateway's login: for this machine only.
      - "127.0.0.1:8000:8000"
    volumes:
      - /data/kae:/data/ssd
    # Settings from .env (see .env.example), when there is one.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - KAE_SSD_PATH=/data/ssd
      - KAE_DATA_DIR=/data/ssd/.kae
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # The login for the UI and the API on :3000 (user: KAE_AUTH_USER, admin
      # by default). Not set, compose refuses to start the service.
      - KAE_AUTH_PASSWORD=${KAE_AUTH_PASSWORD:?set KAE_AUTH_PASSWORD in .env (see .env.example)}
    deploy:
      resources:
        limits:
          memory: 3G
