name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The version the image ships (Dockerfile: python:3.13-slim).
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit and contract tests
        env:
          PYTHONPATH: .
        run: pytest tests/unit tests/contract -q --asyncio-mode=auto

  e2e:
    # The reference tests (TESTS_STOPLIST.md) and the other end-to-end tests:
    # each PDF through the whole pipeline and the XeLaTeX build - on the
    # image's own base (Debian bookworm, Python 3.13) with its TeX packages
    # at their pins (tex-packages.txt), so the overlays are measured on the
    # TeX the service sets books with, not the runner's Ubuntu one (TeX Live
    # 2025 to the image's 2022). They skip where the toolchain is missing,
    # so a run that skips any of them fails.
    runs-on: ubuntu-latest
    container: python:3.13-slim-bookworm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The packages are kept between runs: the toolchain is some 400MB, and
      # one run of the merge into main fetched it off a mirror at 50kB/s for
      # 55 minutes, the job's limit spent before its tests were half run.
      - name: Restore the TeX packages
        uses: actions/cache@v6
        with:
          path: ~/tex-debs
          key: tex-debs-bookworm-${{ hashFiles('tex-packages.txt') }}
          restore-keys: tex-debs-bookworm-

      - name: Install the TeX toolchain the image ships
        # A slow mirror fails here, by name, not as the tests cancelled.
        timeout-minutes: 20
        run: |
          mkdir -p ~/tex-debs/partial
          apt-get update
          grep -v '^#' tex-packages.txt | xargs apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/tex-debs" -o Acquire::Retries=3
          rm -f ~/tex-debs/lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: End-to-end tests
        env:
          PYTHONPATH: .
        run: >-
          pytest tests/e2e tests/test_page_assembler.py -q -rs
          -n auto --dist load --asyncio-mode=auto
          --junitxml=e2e-report.xml

      - name: No end-to-end test skipped
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("e2e-report.xml").getroot()
          skipped = [
              f"{case.get('classname')}::{case.get('name')}: {skip.get('message')}"
              for case in root.iter("testcase") for skip in case.findall("skipped")
          ]
          if skipped:
              print("Skipped, so not checked - the toolchain is incomplete:")
              print("\n".join(skipped))
              sys.exit(1)
          EOF

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

  benchmark:
    # RFC 0009 §5.3: quality regressions block the merge, they do not just get logged.
    # The job runs only when the repository holds a corpus. hashFiles() is not
    # allowed in a job-level `if:` (the whole workflow is rejected then, with
    # no job run), so the check is a step and the rest follow its answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Look for a corpus
        id: corpus
        run: echo "present=${{ hashFiles('benchmark/corpus/**/input.*') != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.corpus.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.corpus.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Quality benchmark (strict)
        if: steps.corpus.outputs.present == 'true'
        env:
          PYTHONPATH: .
        run: |
          python -m src.benchmark.runner \
            --corpus-dir benchmark/corpus \
            --report-out benchmark-report.json \
            --strict-regression-check

      - uses: actions/upload-artifact@v7
        if: always() && steps.corpus.outputs.present == 'true'
        with:
          name: benchmark-report
          path: benchmark-report.json
