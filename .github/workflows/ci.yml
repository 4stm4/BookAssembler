name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Unit and contract tests
        env:
          PYTHONPATH: .
        run: pytest tests/unit tests/contract -q --asyncio-mode=auto

  benchmark:
    # RFC 0009 §5.3: quality regressions block the merge, they do not just get logged.
    runs-on: ubuntu-latest
    if: hashFiles('benchmark/corpus/**/input.*') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Quality benchmark (strict)
        env:
          PYTHONPATH: .
        run: |
          python -m src.benchmark.runner \
            --corpus-dir benchmark/corpus \
            --report-out benchmark-report.json \
            --strict-regression-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: benchmark-report.json
